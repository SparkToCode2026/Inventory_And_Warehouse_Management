<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Product Suppliers</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Google Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Main CSS -->
  <link rel="stylesheet" href="../style.css">

  <!-- Product Supplier CSS -->
  <link rel="stylesheet" href="ProductSupplier.css">
</head>

<body>

  <!-- HEADER -->
  <header class="site-header">
    <div class="container header-inner">
      <a href="../index.html" class="brand">HOME</a>
      <nav class="site-nav" id="siteNav"></nav>
    </div>
  </header>


  <!-- MAIN -->
  <main class="productsupplier-page">

    <div class="container">

      <!-- PAGE HEADER -->
      <div class="page-head">
        <div>
          <h1>Product Suppliers</h1>
          <p class="page-sub">Manage which suppliers provide which products.</p>
        </div>

        <button type="button" class="btn btn-accent hidden" id="addLinkBtn">
          Add Link
        </button>
      </div>


      <!-- STATUS MESSAGE -->
      <div id="statusBanner" class="status-banner" style="display: none;"></div>


      <!-- CREATE / EDIT FORM -->
      <div class="link-form-card" id="linkFormCard" hidden>

        <div class="auth-head">
          <h2 id="formTitle">Add Link</h2>
        </div>

        <form id="linkForm">

          <div class="form-field">
            <label for="productId">Product ID</label>
            <input type="number" id="productId" required>
          </div>

          <div class="form-field">
            <label for="supplierId">Supplier ID</label>
            <input type="number" id="supplierId" required>
          </div>

          <button type="submit" class="btn btn-accent btn-block" id="saveLinkBtn">
            Create Link
          </button>

          <button type="button" class="btn btn-outline btn-block" id="cancelLinkBtn">
            Cancel
          </button>

        </form>
      </div>


      <!-- FILTER -->
      <div class="links-tools">

        <div class="filter-box">
          <input type="number" id="supplierFilter" placeholder="Filter by Supplier ID...">
          <button type="button" class="btn btn-outline" id="filterBtn">Filter</button>
          <button type="button" class="btn btn-outline" id="showAllBtn">Show All</button>
        </div>

        <button type="button" class="btn btn-outline" id="countBtn">Count Suppliers per Product</button>
      </div>


      <!-- LINKS LIST -->
      <section class="links-section">
        <div id="linksContainer">
          <!-- JavaScript will create the link cards here -->
        </div>
      </section>

    </div>
  </main>


  <!-- FOOTER -->
  <footer class="site-footer">
    <div class="container footer-inner">
      <span>Inventory &amp; Warehouse Management System</span>
      <span>Spark to Code 2026</span>
    </div>
  </footer>


  <!-- DELETE CONFIRMATION MODAL -->
  <div class="modal fade" id="deleteConfirmModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Delete Link</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          Are you sure you want to remove this product-supplier link?
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline" data-bs-dismiss="modal">Cancel</button>
          <button type="button" class="btn btn-accent" id="confirmDeleteBtn">Delete</button>
        </div>
      </div>
    </div>
  </div>

  <!-- COUNT RESULTS MODAL -->
  <div class="modal fade" id="countModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Suppliers per Product</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body" id="countModalBody"></div>
      </div>
    </div>
  </div>

  <!-- Bootstrap JS (needed for modals) -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <!-- JavaScript -->
  <script src="ProductSupplier.js"></script>

</body>
</html>
