<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Management </title>
 
  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="../style.css">
</head>
<body>
    <div id="accessDenied" class="hidden d-flex flex-column justify-content-center align-items-center text-center"
       style="min-height:100vh; padding:2rem;">
    <h2>Access Denied</h2>
    <p class="text-muted" style="color: var(--text-dim);">This area is for Managers and Admins only.</p>
    <a href="../index.html" class="btn btn-accent">Back to Dashboard</a>
  </div>

   <div id="pageContent" class="hidden">
 
    <header class="site-header">
      <div class="header-inner container">
        <a href="../index.html" class="brand">HOME</a>
 
        <nav class="site-nav" id="siteNav">
          <a href="users.html" class="nav-link">Users</a>
          <span class="user-info" id="currentUserLabel"></span>
          <button class="btn btn-ghost" id="logoutBtn" type="button">Log Out</button>
        </nav>
 
        <button class="nav-toggle" id="navToggle" type="button" aria-label="Toggle menu">
          <span></span><span></span><span></span>
        </button>
      </div>
    </header>
 
    <main class="container modules">
      <div class="zone">
 
        <div class="d-flex flex-wrap justify-content-between align-items-center zone-title">
          <h2>User Management</h2>
          <a href="../Register/Register.html" class="btn btn-accent">+ Add User</a>
        </div>
 
        <!-- Toolbar: filter by role + warehouse count -->
        <div class="d-flex flex-wrap gap-2 mb-3">
          <select id="roleFilter" class="form-select" style="max-width:200px;">
            <option value="">All Roles</option>
            <option value="Admin">Admin</option>
            <option value="Manager">Manager</option>
            <option value="Staff">Staff</option>
          </select>
          <button id="clearFilterBtn" class="btn btn-outline" type="button">Clear Filter</button>
          <button id="countBtn" class="btn btn-outline" type="button">Count Users per Warehouse</button>
        </div>
 
        <div id="warehouseCounts" class="hidden mb-3"></div>
 
        <!-- Users table -->
        <div class="card-module" style="padding:0; overflow-x:auto;">
          <table class="table mb-0 align-middle" id="usersTable">
            <thead>
              <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Email</th>
                <th>Role</th>
                <th>Phone</th>
                <th>Warehouse</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="usersTableBody">
              <!-- rows are built by users.js -->
            </tbody>
          </table>
        </div>
 
      </div>
    </main>
 

 
  <!--EDIT USER-->
  <div class="modal fade" id="editUserModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Edit User</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <div class="mb-3">
            <label class="form-label" for="editName">Name</label>
            <input type="text" id="editName" class="form-control">
          </div>
          <div class="mb-3">
            <label class="form-label" for="editEmail">Email</label>
            <input type="email" id="editEmail" class="form-control">
          </div>
          <div class="mb-3">
            <label class="form-label" for="editRole">Role</label>
            <select id="editRole" class="form-select">
              <option value="Admin">Admin</option>
              <option value="Manager">Manager</option>
              <option value="Staff">Staff</option>
            </select>
          </div>
          <div class="mb-3">
            <label class="form-label" for="editPhone">Phone</label>
            <input type="text" id="editPhone" class="form-control">
          </div>
        </div>
        <div class="modal-footer">
          <button class="btn btn-outline" data-bs-dismiss="modal" type="button">Cancel</button>
          <button class="btn btn-accent" id="saveEditBtn" type="button">Save Changes</button>
        </div>
      </div>
    </div>
  </div>

  <!-- CHANGE ROLE  -->
<div class="modal fade" id="changeRoleModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Change User Role</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <div class="mb-3">
          <label class="form-label" for="newRoleSelect">Select New Role</label>
          <select id="newRoleSelect" class="form-select">
            <option value="Admin">Admin</option>
            <option value="Manager">Manager</option>
            <option value="Staff">Staff</option>
          </select>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-outline" data-bs-dismiss="modal" type="button">Cancel</button>
        <button class="btn btn-accent" id="saveRoleBtn" type="button">Update Role</button>
      </div>
    </div>
  </div>
</div>
 

<footer class="site-footer">
  <div class="container footer-inner">
    <span>Inventory &amp; Warehouse Management System</span>
    <span>Spark to Code 2026 </span>
  </div>
</footer>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="Users.js"></script>
</body>
</html>
