<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Purchase Order Item Management</title>

    <!-- Bootstrap -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- Fonts -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="../style.css" />
  </head>

  <body>
    <div id="pageContent">
      <!-- HEADER -->
      <header class="site-header">
        <div class="header-inner container">
          <a href="../index.html" class="brand">HOME</a>

          <nav class="site-nav" id="siteNav">
            <a href="PurchaseOrderItem.html" class="nav-link">
              Purchase Order Items
            </a>

            <span class="user-info" id="currentUserLabel"></span>

            <button class="btn btn-ghost hidden" id="logoutBtn" type="button">
              Log Out
            </button>

            <a
              href="../Register/Login.html"
              class="btn btn-ghost hidden"
              id="signInLink"
            >
              Sign In
            </a>
          </nav>

          <button
            class="nav-toggle"
            id="navToggle"
            type="button"
            aria-label="Toggle menu"
            aria-expanded="false"
          >
            <span></span>
            <span></span>
            <span></span>
          </button>
        </div>
      </header>

      <!-- MAIN -->
      <main class="container modules">
        <div class="zone">
          <div
            class="d-flex flex-wrap justify-content-between align-items-center zone-title"
          >
            <h2>Purchase Order Item Management</h2>
            <button class="btn btn-accent hidden" id="addItemBtn" type="button">
              + Add Item
            </button>
          </div>

          <!-- TOOLBAR -->
          <div class="d-flex flex-wrap gap-2 mb-3">
            <input
              type="number"
              id="productIdFilter"
              class="form-control"
              placeholder="Product ID"
              min="1"
              style="max-width: 160px"
            />

            <button id="applyFilterBtn" class="btn btn-outline" type="button">
              Filter
            </button>

            <button id="clearFilterBtn" class="btn btn-outline" type="button">
              Clear Filter
            </button>

            <button id="sortItemsBtn" class="btn btn-outline" type="button">
              Sort by Quantity
            </button>

            <button
              id="itemsByProductBtn"
              class="btn btn-outline"
              type="button"
            >
              By Product
            </button>

            <button
              id="mostOrderedProductsBtn"
              class="btn btn-outline"
              type="button"
            >
              Most Ordered Products
            </button>
          </div>

          <!-- STATUS -->
          <div id="statusBanner" class="hidden mb-3" role="alert"></div>

          <!-- TABLE -->
          <div class="card-module" style="padding: 0; overflow-x: auto">
            <table class="table mb-0 align-middle" id="purchaseOrderItemsTable">
              <thead>
                <tr>
                  <th>ID</th>
                  <th>Purchase Order</th>
                  <th>Product</th>
                  <th>Quantity</th>
                  <th>Unit Price</th>
                  <th>Total Price</th>
                  <th>Actions</th>
                </tr>
              </thead>

              <tbody id="purchaseOrderItemsTableBody">
                <!-- Rows generated by PurchaseOrderItem.js -->
              </tbody>
            </table>
          </div>
        </div>
      </main>

      <!-- FOOTER -->
      <footer class="site-footer">
        <div class="container footer-inner">
          <span> Inventory &amp; Warehouse Management System </span>

          <span> Spark to Code 2026 </span>
        </div>
      </footer>
    </div>

    <div class="modal fade" id="itemModal" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="itemModalTitle">Add Item</h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
            ></button>
          </div>
          <div class="modal-body">
            <div class="mb-3">
              <label class="form-label" for="itemPurchaseOrderId"
                >Purchase Order ID</label
              >
              <input
                type="number"
                id="itemPurchaseOrderId"
                class="form-control"
                min="1"
              />
            </div>
            <div class="mb-3">
              <label class="form-label" for="itemProductId">Product ID</label>
              <input
                type="number"
                id="itemProductId"
                class="form-control"
                min="1"
              />
            </div>
            <div class="mb-3">
              <label class="form-label" for="itemQuantity">Quantity</label>
              <input
                type="number"
                id="itemQuantity"
                class="form-control"
                min="1"
              />
            </div>
            <div class="mb-3">
              <label class="form-label" for="itemUnitPrice">Unit Price</label>
              <input
                type="number"
                id="itemUnitPrice"
                class="form-control"
                step="0.01"
                min="0"
              />
            </div>
          </div>
          <div class="modal-footer">
            <button
              class="btn btn-outline"
              data-bs-dismiss="modal"
              type="button"
            >
              Cancel
            </button>
            <button class="btn btn-accent" id="saveItemBtn" type="button">
              Save Item
            </button>
          </div>
        </div>
      </div>
    </div>

    <div class="modal fade" id="quantityModal" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title">Update Quantity</h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
            ></button>
          </div>
          <div class="modal-body">
            <div class="mb-3">
              <label class="form-label" for="newQuantityInput"
                >New Quantity</label
              >
              <input
                type="number"
                id="newQuantityInput"
                class="form-control"
                min="1"
              />
            </div>
          </div>
          <div class="modal-footer">
            <button
              class="btn btn-outline"
              data-bs-dismiss="modal"
              type="button"
            >
              Cancel
            </button>
            <button class="btn btn-accent" id="saveQuantityBtn" type="button">
              Update Quantity
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- ADDED: Bootstrap JS bundle (required for modals) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="PurchaseOrderItem.js"></script>
  </body>
</html>
