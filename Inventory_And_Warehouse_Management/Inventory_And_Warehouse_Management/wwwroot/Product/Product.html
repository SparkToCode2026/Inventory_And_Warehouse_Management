<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Management</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="../style.css">
</head>
<body>

  <div id="pageContent">

    <header class="site-header">
      <div class="header-inner container">
        <a href="../index.html" class="brand">HOME</a>

        <nav class="site-nav" id="siteNav">
          <a href="Product.html" class="nav-link">Products</a>
          <span class="user-info" id="currentUserLabel"></span>
          <button class="btn btn-ghost hidden" id="logoutBtn" type="button">Log Out</button>
          <a href="../Register/Login.html" class="btn btn-ghost hidden" id="signInLink">Sign In</a>
        </nav>

        <button class="nav-toggle" id="navToggle" type="button" aria-label="Toggle menu">
          <span></span><span></span><span></span>
        </button>
      </div>
    </header>

    <main class="container modules">
      <div class="zone">

        <div class="d-flex flex-wrap justify-content-between align-items-center zone-title">
          <h2>Product Management</h2>
          <button class="btn btn-accent hidden" id="addProductBtn" type="button">+ Add Product</button>
        </div>

        <!-- Toolbar: filter by max price -->
        <div class="d-flex flex-wrap gap-2 mb-3">
          <input type="number" id="maxPriceFilter" class="form-control" placeholder="Max price" style="max-width:160px;" step="0.01" min="0">
          <button id="applyFilterBtn" class="btn btn-outline" type="button">Filter</button>
          <button id="clearFilterBtn" class="btn btn-outline" type="button">Clear Filter</button>
          <button id="sortByPriceBtn" class="btn btn-outline" type="button">Sort by Price</button>
        </div>

        <div id="statusBanner" class="hidden mb-3"></div>

        <!-- Products table -->
        <div class="card-module" style="padding:0; overflow-x:auto;">
          <table class="table mb-0 align-middle" id="productsTable">
            <thead>
              <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Price</th>
                <th>Description</th>
                <th>Category</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="productsTableBody">
              <!-- rows are built by Product.js -->
            </tbody>
          </table>
        </div>

      </div>
    </main>

    <footer class="site-footer">
      <div class="container footer-inner">
        <span>Inventory &amp; Warehouse Management System</span>
        <span>Spark to Code 2026</span>
      </div>
    </footer>

  </div>

  <!-- ADD / EDIT PRODUCT -->
  <div class="modal fade" id="productModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="productModalTitle">Add Product</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <div class="mb-3">
            <label class="form-label" for="productName">Name</label>
            <input type="text" id="productName" class="form-control">
          </div>
          <div class="mb-3">
            <label class="form-label" for="productPrice">Price</label>
            <input type="number" id="productPrice" class="form-control" step="0.01" min="0">
          </div>
          <div class="mb-3">
            <label class="form-label" for="productDescription">Description</label>
            <input type="text" id="productDescription" class="form-control">
          </div>
          <div class="mb-3">
            <label class="form-label" for="productCategory">Category</label>
            <select id="productCategory" class="form-select">
              <option value="">Select a category</option>
            </select>
          </div>
        </div>
        <div class="modal-footer">
          <button class="btn btn-outline" data-bs-dismiss="modal" type="button">Cancel</button>
          <button class="btn btn-accent" id="saveProductBtn" type="button">Save Product</button>
        </div>
      </div>
    </div>
  </div>

  <!-- UPDATE PRICE (second distinct update case) -->
  <div class="modal fade" id="priceModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Update Price</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <div class="mb-3">
            <label class="form-label" for="newPriceInput">New Price</label>
            <input type="number" id="newPriceInput" class="form-control" step="0.01" min="0">
          </div>
        </div>
        <div class="modal-footer">
          <button class="btn btn-outline" data-bs-dismiss="modal" type="button">Cancel</button>
          <button class="btn btn-accent" id="savePriceBtn" type="button">Update Price</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="Product.js"></script>
</body>
</html>
