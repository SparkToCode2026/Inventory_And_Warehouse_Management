<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Change Password</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../style.css">
  <link rel="stylesheet" href="../Register/Auth.css">
</head>
<body>

  <header class="site-header">
    <div class="header-inner container">
      <a href="../index.html" class="brand">HOME</a>
      <nav class="site-nav" id="siteNav">
        <span class="user-info" id="currentUserLabel"></span>
        <button class="btn btn-ghost" id="logoutBtn" type="button">Log Out</button>
      </nav>
    </div>
  </header>

  <main class="auth-page">
    <div class="container">
      <div class="auth-card">
        <div class="auth-head">
          <h1>Change Password</h1>
        </div>

        <div id="statusBanner" class="status-banner" hidden></div>

        <form id="changePasswordForm">
          <div class="form-field">
            <label for="currentPassword">Current Password</label>
            <input type="password" id="currentPassword" required autocomplete="current-password">
          </div>
          <div class="form-field">
            <label for="newPassword">New Password</label>
            <input type="password" id="newPassword" required autocomplete="new-password" minlength="6">
          </div>
          <div class="form-field">
            <label for="confirmPassword">Confirm New Password</label>
            <input type="password" id="confirmPassword" required autocomplete="new-password" minlength="6">
          </div>
          <button type="submit" class="btn btn-accent btn-block" id="changePasswordBtn">Update Password</button>
        </form>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <span>Inventory &amp; Warehouse Management System</span>
      <span>Spark to Code 2026</span>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="ChangePassword.js"></script>
</body>
</html>
