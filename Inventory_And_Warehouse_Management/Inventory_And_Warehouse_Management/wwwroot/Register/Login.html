<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="Auth.css">
</head>
<body>

<header class="site-header">
    <div class="container header-inner">
        <a href="../index.html" class="brand">HOME</a>
        <nav class="site-nav" id="siteNav">
            <a href="Register.html" class="btn btn-ghost">Create Account</a>
        </nav>
    </div>
</header>

<main class="auth-page">
    <div class="container">
        <div class="auth-card">

            <div class="auth-head">
                <p class="auth-eyebrow">Welcome back</p>
                <h1>Sign In</h1>
            </div>

            <div id="statusBanner" class="status-banner" hidden></div>

            <form id="loginForm">
                <div class="form-field">
                    <label for="loginEmail">Email</label>
                    <input type="email" id="loginEmail" required autocomplete="email">
                </div>

                <div class="form-field">
                    <label for="loginPassword">Password</label>
                    <input type="password" id="loginPassword" required autocomplete="current-password">
                </div>

                <button type="submit" class="btn btn-accent btn-block" id="loginSubmitBtn">Sign In</button>
            </form>

            <p class="auth-foot">Don't have an account? <a href="Register.html">Register</a></p>

        </div>
    </div>
</main>

<footer class="site-footer">
    <div class="container footer-inner">
        <span>Inventory &amp; Warehouse Management System</span>
        <span>Spark to Code 2026</span>
    </div>
</footer>

<script src="login.js"></script>
</body>
</html>
