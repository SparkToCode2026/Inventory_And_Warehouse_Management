<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register</title>
 
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
 
<link rel="stylesheet" href="../style.css">
<link rel="stylesheet" href="Auth.css">
</head>
<body>
 
<header class="site-header">
  <div class="container header-inner">
    <a href="../index.html" class="brand">
      HOME
    </a>
    <nav class="site-nav" id="siteNav">
      <a href="login.html" class="btn btn-ghost">Sign In</a>
    </nav>
  </div>
</header>
 
<main class="auth-page">
  <div class="container">
    <div class="auth-card">
 
      <div class="auth-head">
        <p class="module-eyebrow">Create an account</p>
        <h1>Register</h1>
      </div>
 
      <div id="statusBanner" class="status-banner" hidden></div>
 
      <form id="registerForm">
        <div class="form-field">
          <label for="regName">Name</label>
          <input type="text" id="regName" required autocomplete="name">
        </div>
 
        <div class="form-field">
          <label for="regEmail">Email</label>
          <input type="email" id="regEmail" required autocomplete="email">
        </div>
 
        <div class="form-field">
          <label for="regPassword">Password</label>
          <input type="password" id="regPassword" required minlength="6" autocomplete="new-password">
        </div>
 
        <div class="form-field">
          <label for="regConfirmPassword">Confirm Password</label>
          <input type="password" id="regConfirmPassword" required minlength="6" autocomplete="new-password">
        </div>
 
        <div class="form-field">
          <label for="regRole">Role</label>
          <select id="regRole" required>
            <option value="">Select a role</option>
            <option value="Admin">Admin</option>
            <option value="Manager">Manager</option>
            <option value="Staff">Staff</option>
          </select>
        </div>
 
        <div class="form-field">
          <label for="regPhone">Phone <span class="optional-tag">(optional)</span></label>
          <input type="text" id="regPhone" autocomplete="tel">
        </div>
 
        <button type="submit" class="btn btn-accent btn-block" id="registerSubmitBtn">Create Account</button>
      </form>
 
      <p class="auth-foot">Already have an account? <a href="login.html">Sign in</a></p>
 
    </div>
  </div>
</main>
 
<footer class="site-footer">
  <div class="container footer-inner">
    <span>Inventory &amp; Warehouse Management System</span>
    <span>Spark to Code 2026</span>
  </div>
</footer>
 
<script src="Register.js"></script>
</body>
</html>
