<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Purchase Order Management</title>

    <!-- Bootstrap -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- Fonts -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="../style.css" />
  </head>

  <body>
    <div id="pageContent">
      <!-- HEADER -->
      <header class="site-header">
        <div class="header-inner container">
          <a href="../index.html" class="brand">HOME</a>

          <nav class="site-nav" id="siteNav">
            <a href="PurchaseOrder.html" class="nav-link"> Purchase Orders </a>

            <span class="user-info" id="currentUserLabel"></span>

            <button class="btn btn-ghost hidden" id="logoutBtn" type="button">
              Log Out
            </button>

            <a
              href="../Register/Login.html"
              class="btn btn-ghost hidden"
              id="signInLink"
            >
              Sign In
            </a>
          </nav>

          <button
            class="nav-toggle"
            id="navToggle"
            type="button"
            aria-label="Toggle menu"
            aria-expanded="false"
          >
            <span></span>
            <span></span>
            <span></span>
          </button>
        </div>
      </header>

      <!-- MAIN -->
      <main class="container modules">
        <div class="zone">
          <div
            class="d-flex flex-wrap justify-content-between align-items-center zone-title"
          >
            <h2>Purchase Order Management</h2>
          </div>

          <!-- TOOLBAR -->
          <div class="d-flex flex-wrap gap-2 mb-3">
            <select
              id="statusFilter"
              class="form-select"
              style="max-width: 170px"
            >
              <option value="">All Statuses</option>
              <option value="Pending">Pending</option>
              <option value="Approved">Approved</option>
              <option value="Received">Received</option>
            </select>

            <input
              type="date"
              id="fromDateFilter"
              class="form-control"
              style="max-width: 180px"
              aria-label="From date"
            />

            <input
              type="date"
              id="toDateFilter"
              class="form-control"
              style="max-width: 180px"
              aria-label="To date"
            />

            <button id="applyFilterBtn" class="btn btn-outline" type="button">
              Filter
            </button>

            <button id="clearFilterBtn" class="btn btn-outline" type="button">
              Clear Filter
            </button>

            <button
              id="sortPurchaseOrdersBtn"
              class="btn btn-outline"
              type="button"
            >
              Sort by Total
            </button>

            <button
              id="supplierTotalsBtn"
              class="btn btn-outline"
              type="button"
            >
              Total by Supplier
            </button>
          </div>

          <!-- STATUS -->
          <div id="statusBanner" class="hidden mb-3" role="alert"></div>

          <!-- TABLE -->
          <div class="card-module" style="padding: 0; overflow-x: auto">
            <table class="table mb-0 align-middle" id="purchaseOrdersTable">
              <thead>
                <tr>
                  <th>ID</th>
                  <th>Supplier</th>
                  <th>Status</th>
                  <th>Order Date</th>
                  <th>Total Amount</th>
                </tr>
              </thead>

              <tbody id="purchaseOrdersTableBody">
                <!-- Rows generated by PurchaseOrder.js -->
              </tbody>
            </table>
          </div>
        </div>
      </main>

      <!-- FOOTER -->
      <footer class="site-footer">
        <div class="container footer-inner">
          <span> Inventory &amp; Warehouse Management System </span>

          <span> Spark to Code 2026 </span>
        </div>
      </footer>
    </div>

    <script src="PurchaseOrder.js"></script>
  </body>
</html>
