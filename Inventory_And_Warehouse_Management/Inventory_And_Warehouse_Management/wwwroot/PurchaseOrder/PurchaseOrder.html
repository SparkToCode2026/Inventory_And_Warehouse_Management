<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Purchase Order Management</title>

    <!-- Bootstrap -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="../style.css" />
  </head>
  <body>
    <div id="pageContent">
      <header class="site-header">
        <div class="header-inner container">
          <a href="../index.html" class="brand">HOME</a>

          <nav class="site-nav" id="siteNav">
            <a href="PurchaseOrder.html" class="nav-link">Purchase Orders</a>
            <a
              href="../PurchaseOrderItem/PurchaseOrderItem.html"
              class="nav-link"
              >Purchase Order Items</a
            >
            <span class="user-info" id="currentUserLabel"></span>
            <button class="btn btn-ghost hidden" id="logoutBtn" type="button">
              Log Out
            </button>
            <a
              href="../Register/Login.html"
              class="btn btn-ghost hidden"
              id="signInLink"
              >Sign In</a
            >
          </nav>

          <button
            class="nav-toggle"
            id="navToggle"
            type="button"
            aria-label="Toggle menu"
          >
            <span></span><span></span><span></span>
          </button>
        </div>
      </header>

      <main class="container modules">
        <div class="zone">
          <div
            class="d-flex flex-wrap justify-content-between align-items-center zone-title"
          >
            <h2>Purchase Order Management</h2>
            <button
              class="btn btn-accent hidden"
              id="addPurchaseOrderBtn"
              type="button"
            >
              + Add Purchase Order
            </button>
          </div>

          <div id="statusBanner" class="hidden mb-3"></div>

          <!-- Purchase Orders table -->
          <div class="card-module" style="padding: 0; overflow-x: auto">
            <table class="table mb-0 align-middle" id="purchaseOrdersTable">
              <thead>
                <tr>
                  <th>ID</th>
                  <th>Order Date</th>
                  <th>Status</th>
                  <th>Total Amount</th>
                  <th>Supplier ID</th>
                  <th>User ID</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody id="purchaseOrdersTableBody">
                <!-- rows are built by PurchaseOrder.js -->
              </tbody>
            </table>
          </div>
        </div>
      </main>

      <footer class="site-footer">
        <div class="container footer-inner">
          <span>Inventory &amp; Warehouse Management System</span>
          <span>Spark to Code 2026</span>
        </div>
      </footer>
    </div>

    <!-- ADD / EDIT PURCHASE ORDER -->
    <div
      class="modal fade"
      id="purchaseOrderModal"
      tabindex="-1"
      aria-hidden="true"
    >
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="purchaseOrderModalTitle">
              Add Purchase Order
            </h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
            ></button>
          </div>
          <div class="modal-body">
            <div class="mb-3">
              <label class="form-label" for="poStatus">Status</label>
              <select id="poStatus" class="form-select">
                <option value="Pending">Pending</option>
                <option value="Approved">Approved</option>
                <option value="Received">Received</option>
              </select>
            </div>
            <div class="mb-3">
              <label class="form-label" for="poOrderDate">Order Date</label>
              <input type="date" id="poOrderDate" class="form-control" />
            </div>
            <div class="mb-3">
              <label class="form-label" for="poTotalAmount">Total Amount</label>
              <input
                type="number"
                id="poTotalAmount"
                class="form-control"
                step="0.01"
                min="0"
              />
            </div>
            <div class="mb-3">
              <label class="form-label" for="poSupplierId">Supplier ID</label>
              <input
                type="number"
                id="poSupplierId"
                class="form-control"
                min="1"
              />
            </div>
            <div class="mb-3">
              <label class="form-label" for="poUserId">User ID</label>
              <input type="number" id="poUserId" class="form-control" min="1" />
            </div>
          </div>
          <div class="modal-footer">
            <button
              class="btn btn-outline"
              data-bs-dismiss="modal"
              type="button"
            >
              Cancel
            </button>
            <button
              class="btn btn-accent"
              id="savePurchaseOrderBtn"
              type="button"
            >
              Save Purchase Order
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- UPDATE STATUS (second distinct update case) -->
    <div class="modal fade" id="statusModal" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title">Update Status</h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
            ></button>
          </div>
          <div class="modal-body">
            <div class="mb-3">
              <label class="form-label" for="newStatusInput">New Status</label>
              <select id="newStatusInput" class="form-select">
                <option value="Pending">Pending</option>
                <option value="Approved">Approved</option>
                <option value="Received">Received</option>
              </select>
            </div>
          </div>
          <div class="modal-footer">
            <button
              class="btn btn-outline"
              data-bs-dismiss="modal"
              type="button"
            >
              Cancel
            </button>
            <button class="btn btn-accent" id="saveStatusBtn" type="button">
              Update Status
            </button>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="PurchaseOrder.js"></script>
  </body>
</html>
