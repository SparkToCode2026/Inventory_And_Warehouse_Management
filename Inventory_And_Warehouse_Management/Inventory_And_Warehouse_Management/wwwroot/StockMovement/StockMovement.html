<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stock Movements</title>
 
  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
 
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
 
  <link rel="stylesheet" href="../style.css">
</head>
<body>
 <div id="accessDenied" class="hidden d-flex flex-column justify-content-center align-items-center text-center"
       style="min-height:100vh; padding:2rem;">
    <h2>Access Denied</h2>
    <p class="text-muted" style="color: var(--text-dim);">Please log in to view stock movements.</p>
    <a href="../index.html" class="btn btn-accent">Back to Dashboard</a>
  </div>
 
  <div id="pageContent" class="hidden">
 
    <header class="site-header">
      <div class="header-inner container">
        <a href="../index.html" class="brand">HOME</a>
 
        <nav class="site-nav" id="siteNav">
          <a href="stockmovement.html" class="nav-link">Stock Movements</a>
          <span class="user-info" id="currentUserLabel"></span>
          <button class="btn btn-ghost" id="logoutBtn" type="button">Log Out</button>
        </nav>
 
        <button class="nav-toggle" id="navToggle" type="button" aria-label="Toggle menu">
          <span></span><span></span><span></span>
        </button>
      </div>
    </header>
 
    <main class="container modules">
      <div class="zone">
 
        <div class="d-flex flex-wrap justify-content-between align-items-center zone-title">
          <h2>Stock Movements</h2>
          <button class="btn btn-accent" id="addMovementBtn" type="button">+ Add Movement</button>
        </div>
 
        <!-- Toolbar: date range filter + movement type totals -->
        <div class="d-flex flex-wrap gap-2 mb-3 align-items-end">
          <div>
            <label class="form-label mb-1" for="startDate" style="font-size:.8rem; color:var(--text-dim);">Start Date</label>
            <input type="date" id="startDate" class="form-control" style="max-width:180px;">
          </div>
          <div>
            <label class="form-label mb-1" for="endDate" style="font-size:.8rem; color:var(--text-dim);">End Date</label>
            <input type="date" id="endDate" class="form-control" style="max-width:180px;">
          </div>
          <button id="dateFilterBtn" class="btn btn-outline" type="button">Filter by Date</button>
          <button id="clearFilterBtn" class="btn btn-outline" type="button">Clear Filter</button>
          <button id="sumBtn" class="btn btn-outline" type="button">Totals by Movement Type</button>
        </div>
 
        <div id="movementSums" class="hidden mb-3"></div>
 
        <!-- Stock Movements table -->
        <div class="card-module" style="padding:0; overflow-x:auto;">
          <table class="table mb-0 align-middle" id="movementsTable">
            <thead>
              <tr>
                <th>ID</th>
                <th>Product</th>
                <th>Warehouse</th>
                <th>Type</th>
                <th>Quantity</th>
                <th>Date</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="movementsTableBody">
              <!-- rows are built by StockMovement.js -->
            </tbody>
          </table>
        </div>
 
      </div>
    </main>
 
    <!-- ADD MOVEMENT -->
    <div class="modal fade" id="addMovementModal" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title">Add Stock Movement</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body">
            <div class="mb-3">
              <label class="form-label" for="addProductId">Product ID</label>
              <input type="number" id="addProductId" class="form-control" min="1">
            </div>
            <div class="mb-3">
              <label class="form-label" for="addWarehouseId">Warehouse ID</label>
              <input type="number" id="addWarehouseId" class="form-control" min="1">
            </div>
            <div class="mb-3">
              <label class="form-label" for="addQuantity">Quantity</label>
              <input type="number" id="addQuantity" class="form-control" min="1">
            </div>
            <div class="mb-3">
              <label class="form-label" for="addMovementType">Movement Type</label>
              <select id="addMovementType" class="form-select">
                <option value="IN">IN</option>
                <option value="OUT">OUT</option>
              </select>
            </div>
            <div class="mb-3">
              <label class="form-label" for="addMovementDate">Movement Date</label>
              <input type="datetime-local" id="addMovementDate" class="form-control">
            </div>
          </div>
          <div class="modal-footer">
            <button class="btn btn-outline" data-bs-dismiss="modal" type="button">Cancel</button>
            <button class="btn btn-accent" id="saveAddBtn" type="button">Add Movement</button>
          </div>
        </div>
      </div>
    </div>
 
    <!-- EDIT MOVEMENT -->
    <div class="modal fade" id="editMovementModal" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title">Edit Stock Movement</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body">
            <div class="mb-3">
              <label class="form-label" for="editProductId">Product ID</label>
              <input type="number" id="editProductId" class="form-control" min="1">
            </div>
            <div class="mb-3">
              <label class="form-label" for="editWarehouseId">Warehouse ID</label>
              <input type="number" id="editWarehouseId" class="form-control" min="1">
            </div>
            <div class="mb-3">
              <label class="form-label" for="editQuantity">Quantity</label>
              <input type="number" id="editQuantity" class="form-control" min="1">
            </div>
            <div class="mb-3">
              <label class="form-label" for="editMovementType">Movement Type</label>
              <select id="editMovementType" class="form-select">
                <option value="IN">IN</option>
                <option value="OUT">OUT</option>
              </select>
            </div>
            <div class="mb-3">
              <label class="form-label" for="editMovementDate">Movement Date</label>
              <input type="datetime-local" id="editMovementDate" class="form-control">
            </div>
          </div>
          <div class="modal-footer">
            <button class="btn btn-outline" data-bs-dismiss="modal" type="button">Cancel</button>
            <button class="btn btn-accent" id="saveEditBtn" type="button">Save Changes</button>
          </div>
        </div>
      </div>
    </div>
 
    <!-- UPDATE QUANTITY -->
    <div class="modal fade" id="qtyModal" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title">Update Quantity</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body">
            <div class="mb-3">
              <label class="form-label" for="newQuantity">New Quantity</label>
              <input type="number" id="newQuantity" class="form-control" min="1">
            </div>
          </div>
          <div class="modal-footer">
            <button class="btn btn-outline" data-bs-dismiss="modal" type="button">Cancel</button>
            <button class="btn btn-accent" id="saveQtyBtn" type="button">Update Quantity</button>
          </div>
        </div>
      </div>
    </div>
 
    <footer class="site-footer">
      <div class="container footer-inner">
        <span>Inventory &amp; Warehouse Management System</span>
        <span>Spark to Code 2026</span>
      </div>
    </footer>
  </div>
 
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="StockMovement.js"></script>
</body>
</html>
