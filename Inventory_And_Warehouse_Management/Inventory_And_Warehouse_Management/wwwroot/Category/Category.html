<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Category Management</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="../style.css">
</head>
<body>

  <div id="pageContent">

    <header class="site-header">
      <div class="header-inner container">
        <a href="../index.html" class="brand">HOME</a>

        <nav class="site-nav" id="siteNav">
          <a href="Categories.html" class="nav-link">Category</a>
          <span class="user-info" id="currentUserLabel"></span>
          <button class="btn btn-ghost hidden" id="logoutBtn" type="button">Log Out</button>
          <a href="../Register/Login.html" class="btn btn-ghost hidden" id="signInLink">Sign In</a>
        </nav>

        <button class="nav-toggle" id="navToggle" type="button" aria-label="Toggle menu">
          <span></span><span></span><span></span>
        </button>
      </div>
    </header>

    <main class="container modules">
      <div class="zone">

        <div class="d-flex flex-wrap justify-content-between align-items-center zone-title">
          <h2>Category Management</h2>
          <button class="btn btn-accent hidden" id="addCategoryBtn" type="button">+ Add Category</button>
        </div>

        <!-- Toolbar: filter by name -->
        <div class="d-flex flex-wrap gap-2 mb-3">
          <input type="text" id="nameFilter" class="form-control" placeholder="Filter by name" style="max-width:160px;">
          <button id="applyFilterBtn" class="btn btn-outline" type="button">Filter</button>
          <button id="clearFilterBtn" class="btn btn-outline" type="button">Clear Filter</button>
          <button id="sortByProductsBtn" class="btn btn-outline" type="button">Sort by Number of Products</button>
        </div>

        <div id="statusBanner" class="hidden mb-3"></div>

        <!-- Category table -->
        <div class="card-module" style="padding:0; overflow-x:auto;">
          <table class="table mb-0 align-middle" id="CategoryTable">
            <thead>
              <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Description</th>
                <th>Products</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="CategoryTableBody">
              <!-- rows are built by Category.js -->
            </tbody>
          </table>
        </div>

      </div>
    </main>

    <footer class="site-footer">
      <div class="container footer-inner">
        <span>Inventory &amp; Warehouse Management System</span>
        <span>Spark to Code 2026</span>
      </div>
    </footer>

  </div>

  <!-- ADD / EDIT CATEGORY -->
  <div class="modal fade" id="categoryModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="categoryModalTitle">Add Category</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <div class="mb-3">
            <label class="form-label" for="categoryName">Name</label>
            <input type="text" id="categoryName" class="form-control">
          </div>
          <div class="mb-3">
            <label class="form-label" for="categoryDescription">Description</label>
            <input type="text" id="categoryDescription" class="form-control">
          </div>
        </div>
        <div class="modal-footer">
          <button class="btn btn-outline" data-bs-dismiss="modal" type="button">Cancel</button>
          <button class="btn btn-accent" id="saveCategoryBtn" type="button">Save Category</button>
        </div>
      </div>
    </div>
  </div>

  <!-- UPDATE DESCRIPTION (second distinct update case) -->
  <div class="modal fade" id="descriptionModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Update Description</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <div class="mb-3">
            <label class="form-label" for="newDescriptionInput">New Description</label>
            <input type="text" id="newDescriptionInput" class="form-control">
          </div>
        </div>
        <div class="modal-footer">
          <button class="btn btn-outline" data-bs-dismiss="modal" type="button">Cancel</button>
          <button class="btn btn-accent" id="saveDescriptionBtn" type="button">Update Description</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="Category.js"></script>
</body>
</html>
