<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Customer Management</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="../style.css">
</head>
<body>

  <div id="pageContent">

    <header class="site-header">
      <div class="header-inner container">
        <a href="../index.html" class="brand">HOME</a>

        <nav class="site-nav" id="siteNav">
          <a href="Customer.html" class="nav-link">Customers</a>
          <span class="user-info" id="currentUserLabel"></span>
          <button class="btn btn-ghost hidden" id="logoutBtn" type="button">Log Out</button>
          <a href="../Register/Login.html" class="btn btn-ghost hidden" id="signInLink">Sign In</a>
        </nav>
      </div>
    </header>

    <main class="container modules">
      <div class="zone">

        <div class="d-flex flex-wrap justify-content-between align-items-center zone-title">
          <h2>Customer Management</h2>
          <button class="btn btn-accent hidden" id="addCustomerBtn" type="button">+ Add Customer</button>
        </div>

        <!-- Toolbar: filter by name / sort -->
        <div id="customerToolbar" class="d-flex flex-wrap gap-2 mb-3">
          <input type="text" id="nameFilter" class="form-control" placeholder="Filter by name" style="max-width:200px;">
          <button id="applyFilterBtn" class="btn btn-outline" type="button">Filter</button>
          <button id="clearFilterBtn" class="btn btn-outline" type="button">Clear Filter</button>
          <button id="sortByOrdersBtn" class="btn btn-outline" type="button">Sort by # of Sales Orders</button>
        </div>

        <div id="statusBanner" class="hidden mb-3"></div>

        <!-- Signed-out notice (Customer requires sign-in even to view) -->
        <div id="signedOutNotice" class="hidden text-center py-5">
          <h5>Sign in required</h5>
          <p class="text-muted" style="color: var(--text-dim);">You need to sign in to view and manage customers.</p>
          <a href="../Register/Login.html" class="btn btn-accent">Sign In</a>
        </div>

        <!-- Customers table -->
        <div id="customerTableWrap" class="card-module hidden" style="padding:0; overflow-x:auto;">
          <table class="table mb-0 align-middle" id="customersTable">
            <thead>
              <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Email</th>
                <th>Phone</th>
                <th>Location</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="customersTableBody">
              <!-- rows are built by Customer.js -->
            </tbody>
          </table>
        </div>

      </div>
    </main>

    <footer class="site-footer">
      <div class="container footer-inner">
        <span>Inventory &amp; Warehouse Management System</span>
        <span>Spark to Code 2026</span>
      </div>
    </footer>

  </div>

  <!-- ADD / EDIT CUSTOMER -->
  <div class="modal fade" id="customerModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="customerModalTitle">Add Customer</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <div class="mb-3">
            <label class="form-label" for="customerName">Name</label>
            <input type="text" id="customerName" class="form-control">
          </div>
          <div class="mb-3">
            <label class="form-label" for="customerEmail">Email</label>
            <input type="email" id="customerEmail" class="form-control">
          </div>
          <div class="mb-3">
            <label class="form-label" for="customerPhone">Phone</label>
            <input type="text" id="customerPhone" class="form-control">
          </div>
          <div class="mb-3">
            <label class="form-label" for="customerLocation">Location</label>
            <input type="text" id="customerLocation" class="form-control">
          </div>
        </div>
        <div class="modal-footer">
          <button class="btn btn-outline" data-bs-dismiss="modal" type="button">Cancel</button>
          <button class="btn btn-accent" id="saveCustomerBtn" type="button">Save Customer</button>
        </div>
      </div>
    </div>
  </div>

  <!-- UPDATE LOCATION (second distinct update case) -->
  <div class="modal fade" id="locationModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Update Location</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <div class="mb-3">
            <label class="form-label" for="newLocationInput">New Location</label>
            <input type="text" id="newLocationInput" class="form-control">
          </div>
        </div>
        <div class="modal-footer">
          <button class="btn btn-outline" data-bs-dismiss="modal" type="button">Cancel</button>
          <button class="btn btn-accent" id="saveLocationBtn" type="button">Update Location</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="Customer.js"></script>
</body>
</html>
