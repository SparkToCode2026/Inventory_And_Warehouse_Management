<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Sales Order Items</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Google Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Main CSS -->
  <link rel="stylesheet" href="../style.css">

  <!-- Sales Order Items CSS -->
  <link rel="stylesheet" href="SalesOrderItems.css">
</head>

<body>

  <!-- HEADER -->
  <header class="site-header">
    <div class="container header-inner">

      <a href="../index.html" class="brand">
        HOME
      </a>

      <nav class="site-nav" id="siteNav">
      </nav>

    </div>
  </header>


  <!-- MAIN -->
  <main class="salesorderitems-page">

    <div class="container">

      <!-- PAGE HEADER -->
      <div class="page-head">

        <div>
          <h1>Sales Order Items</h1>
          <p class="page-sub">
            Manage line items within customer sales orders.
          </p>
        </div>

        <button
          type="button"
          class="btn btn-accent"
          id="addItemBtn">
          Add Order Item
        </button>

      </div>


      <!-- STATUS MESSAGE -->
      <div id="statusBanner" class="status-banner" style="display: none;"></div>


      <!-- CREATE / EDIT FORM -->
      <div class="item-form-card" id="itemFormCard" hidden>

        <div class="auth-head">
          <h2 id="formTitle">Add Order Item</h2>
        </div>

        <form id="salesOrderItemForm">

          <div class="form-field">
            <label for="salesOrderId">Sales Order</label>
            <select id="salesOrderId" required>
              <option value="">Select a sales order</option>
            </select>
          </div>

          <div class="form-field">
            <label for="productId">Product</label>
            <select id="productId" required>
              <option value="">Select a product</option>
            </select>
          </div>

          <div class="form-field">
            <label for="quantity">Quantity</label>
            <input
              type="number"
              id="quantity"
              min="1"
              required>
          </div>

          <div class="form-field">
            <label for="unitPrice">Unit Price</label>
            <input
              type="number"
              id="unitPrice"
              step="0.01"
              min="0"
              required>
          </div>

          <button
            type="submit"
            class="btn btn-accent btn-block"
            id="saveItemBtn">
            Create Item
          </button>

          <button
            type="button"
            class="btn btn-outline btn-block"
            id="cancelItemBtn">
            Cancel
          </button>

        </form>

      </div>


      <!-- FILTER / SORT -->
      <div class="items-tools">

        <div class="filter-box">

          <input
            type="number"
            id="productFilter"
            placeholder="Filter by Product ID...">

          <button
            type="button"
            class="btn btn-outline"
            id="filterBtn">
            Filter
          </button>

          <button
            type="button"
            class="btn btn-outline"
            id="showAllBtn">
            Show All
          </button>

        </div>

        <button
          type="button"
          class="btn btn-outline"
          id="sortBtn">
          Sort by Quantity
        </button>

      </div>


      <!-- SALES ORDER ITEMS LIST -->
      <section class="items-section">

        <div id="itemsContainer">
          <!-- JavaScript will create the item cards here -->
        </div>

      </section>

    </div>

  </main>


  <!-- FOOTER -->
  <footer class="site-footer">

    <div class="container footer-inner">
      <span>Inventory &amp; Warehouse Management System</span>
      <span>Spark to Code 2026</span>
    </div>

  </footer>


  <!-- DELETE CONFIRMATION MODAL -->
  <div class="modal fade" id="deleteConfirmModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Delete Order Item</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          Are you sure you want to delete this order item? This will not adjust the parent order's total automatically.
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline" data-bs-dismiss="modal">Cancel</button>
          <button type="button" class="btn btn-accent" id="confirmDeleteBtn">Delete</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Bootstrap JS (needed for modals) -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <!-- JavaScript -->
  <script src="SalesOrderItems.js"></script>

</body>
</html>
