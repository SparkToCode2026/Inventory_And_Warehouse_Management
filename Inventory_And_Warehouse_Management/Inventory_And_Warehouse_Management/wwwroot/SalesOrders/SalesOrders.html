<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Sales Orders</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Google Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Main CSS -->
  <link rel="stylesheet" href="../style.css">

  <!-- Sales Orders CSS -->
  <link rel="stylesheet" href="SalesOrders.css">
</head>

<body>

  <!-- HEADER -->
  <header class="site-header">
    <div class="container header-inner">

      <a href="../index.html" class="brand">
        HOME
      </a>

      <nav class="site-nav">
        <a href="../index.html" class="btn btn-ghost">Home</a>
      </nav>

    </div>
  </header>


  <!-- MAIN -->
  <main class="sales-orders-page">

    <div class="container">

      <!-- PAGE HEADER -->
      <div class="page-head">

        <div>
          <p class="module-eyebrow">Sales</p>
          <h1>Sales Orders</h1>
          <p class="page-sub">
            Manage customer sales orders.
          </p>
        </div>

        <button
          type="button"
          class="btn btn-accent"
          id="addOrderBtn">
          Add Sales Order
        </button>

      </div>


      <!-- STATUS MESSAGE -->
      <div id="statusBanner" class="status-banner" hidden></div>


      <!-- CREATE / EDIT FORM -->
      <div class="order-form-card" id="orderFormCard" hidden>

        <div class="auth-head">
          <p class="module-eyebrow">Sales Order</p>
          <h2 id="formTitle">Add Sales Order</h2>
        </div>

        <form id="salesOrderForm">

          <div class="form-field">
            <label for="customerId">Customer ID</label>
            <input
              type="number"
              id="customerId"
              required>
          </div>

          <div class="form-field">
            <label for="userId">User ID</label>
            <input
              type="number"
              id="userId"
              required>
          </div>

          <div class="form-field">
            <label for="orderDate">Order Date</label>
            <input
              type="datetime-local"
              id="orderDate"
              required>
          </div>

          <div class="form-field">
            <label for="totalAmount">Total Amount</label>
            <input
              type="number"
              id="totalAmount"
              step="0.01"
              min="0"
              required>
          </div>

          <div class="form-field">
            <label for="orderStatus">Status</label>

            <select id="orderStatus" required>
              <option value="">Select a status</option>
              <option value="Pending">Pending</option>
              <option value="Shipped">Shipped</option>
              <option value="Delivered">Delivered</option>
            </select>
          </div>

          <button
            type="submit"
            class="btn btn-accent btn-block"
            id="saveOrderBtn">
            Create Order
          </button>

          <button
            type="button"
            class="btn btn-outline btn-block"
            id="cancelOrderBtn">
            Cancel
          </button>

        </form>

      </div>


      <!-- FILTER / SORT -->
      <div class="orders-tools">

        <div class="filter-box">

          <input
            type="text"
            id="statusFilter"
            placeholder="Enter status...">

          <button
            type="button"
            class="btn btn-outline"
            id="filterBtn">
            Filter
          </button>

          <button
            type="button"
            class="btn btn-outline"
            id="showAllBtn">
            Show All
          </button>

        </div>

        <button
          type="button"
          class="btn btn-outline"
          id="sortBtn">
          Sort by Total
        </button>

      </div>


      <!-- SALES ORDERS LIST -->
      <section class="orders-section">

        <div class="section-head">
          <h2>Sales Orders</h2>
        </div>

        <div id="ordersContainer">
          <!-- JavaScript will create the order cards here -->
        </div>

      </section>

    </div>

  </main>


  <!-- FOOTER -->
  <footer class="site-footer">

    <div class="container footer-inner">
      <span>Inventory &amp; Warehouse Management System</span>
      <span>Spark to Code 2026</span>
    </div>

  </footer>


  <!-- JavaScript -->
  <script src="SalesOrders.js"></script>

</body>
</html>
