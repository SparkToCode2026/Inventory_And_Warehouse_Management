<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inventory Levels · Warehouse Management</title>

  <!-- Bootstrap 5.3.3 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../style.css">
</head>
<body>

  <!-- Access Denied / Signed Out Notice -->
  <div id="accessDenied" class="hidden d-flex flex-column justify-content-center align-items-center text-center" style="min-height:100vh; padding:2rem;">
    <h2>Access Denied</h2>
    <p class="text-muted" style="color: var(--text-dim);">Please log in to view and manage inventory levels.</p>
    <a href="../Register/Login.html" class="btn btn-accent">Sign In</a>
  </div>

  <!-- Main Page Content -->
  <div id="pageContent" class="hidden">

    <header class="site-header">
      <div class="header-inner container">
        <a href="../index.html" class="brand">HOME</a>

        <nav class="site-nav" id="siteNav">
          <a href="InventoryLevel.html" class="nav-link active">Inventory Levels</a>
          <span class="user-info" id="currentUserLabel"></span>
          <button class="btn btn-ghost" id="logoutBtn" type="button">Log Out</button>
        </nav>

        <button class="nav-toggle" id="navToggle" type="button" aria-label="Toggle menu">
          <span></span><span></span><span></span>
        </button>
      </div>
    </header>

    <main class="container modules">
      <div class="zone">

        <div class="d-flex flex-wrap justify-content-between align-items-center zone-title mb-3">
          <h2>Inventory Levels</h2>
          <button class="btn btn-accent" id="openAddModalBtn" type="button">+ Add Inventory Level</button>
        </div>

        <!-- Toolbar -->
        <div class="d-flex flex-wrap gap-2 mb-3 align-items-end">
          <button id="showAllBtn" class="btn btn-outline" type="button">All Stock</button>
          <button id="lowStockFilterBtn" class="btn btn-outline" type="button">View Low Stock Only</button>
          <button id="totalsBtn" class="btn btn-outline" type="button">Totals by Product</button>
        </div>

        <!-- Totals summary box -->
        <div id="totalsSummary" class="hidden mb-3"></div>

        <!-- Inventory Levels Table -->
        <div class="card-module" style="padding:0; overflow-x:auto;">
          <table class="table mb-0 align-middle" id="inventoryTable">
            <thead>
              <tr>
                <th>Warehouse</th>
                <th>Product</th>
                <th>Qty On Hand</th>
                <th>Reorder Threshold</th>
                <th>Status</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="inventoryTableBody">
              <!-- Rows built by InventoryLevel.js -->
            </tbody>
          </table>
        </div>

      </div>
    </main>

    <!-- ADD INVENTORY LEVEL MODAL -->
    <div class="modal fade" id="addInventoryModal" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title">Add Inventory Level</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body">
            <div class="mb-3">
              <label class="form-label" for="addWarehouseId">Warehouse ID</label>
              <input type="number" id="addWarehouseId" class="form-control" min="1">
            </div>
            <div class="mb-3">
              <label class="form-label" for="addProductId">Product ID</label>
              <input type="number" id="addProductId" class="form-control" min="1">
            </div>
            <div class="mb-3">
              <label class="form-label" for="addQuantityOnHand">Quantity On Hand</label>
              <input type="number" id="addQuantityOnHand" class="form-control" min="0">
            </div>
            <div class="mb-3">
              <label class="form-label" for="addReorderThreshold">Reorder Threshold</label>
              <input type="number" id="addReorderThreshold" class="form-control" min="0">
            </div>
          </div>
          <div class="modal-footer">
            <button class="btn btn-outline" data-bs-dismiss="modal" type="button">Cancel</button>
            <button class="btn btn-accent" id="saveAddBtn" type="button">Add Level</button>
          </div>
        </div>
      </div>
    </div>

    <!-- EDIT INVENTORY LEVEL MODAL -->
    <div class="modal fade" id="editInventoryModal" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title">Edit Inventory Level</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body">
            <div class="mb-3">
              <label class="form-label" for="editQuantityOnHand">Quantity On Hand</label>
              <input type="number" id="editQuantityOnHand" class="form-control" min="0">
            </div>
            <div class="mb-3">
              <label class="form-label" for="editReorderThreshold">Reorder Threshold</label>
              <input type="number" id="editReorderThreshold" class="form-control" min="0">
            </div>
          </div>
          <div class="modal-footer">
            <button class="btn btn-outline" data-bs-dismiss="modal" type="button">Cancel</button>
            <button class="btn btn-accent" id="saveEditBtn" type="button">Save Changes</button>
          </div>
        </div>
      </div>
    </div>

    <!-- ADJUST QUANTITY MODAL -->
    <div class="modal fade" id="adjustQtyModal" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title">Adjust Quantity</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body">
            <div class="mb-3">
              <label class="form-label" for="adjustDelta">Quantity Adjustment (+/-)</label>
              <input type="number" id="adjustDelta" class="form-control" placeholder="e.g. 5 or -3">
            </div>
          </div>
          <div class="modal-footer">
            <button class="btn btn-outline" data-bs-dismiss="modal" type="button">Cancel</button>
            <button class="btn btn-accent" id="saveAdjustBtn" type="button">Apply Adjustment</button>
          </div>
        </div>
      </div>
    </div>

    <footer class="site-footer">
      <div class="container footer-inner">
        <span>Inventory &amp; Warehouse Management System</span>
        <span>Spark to Code 2026</span>
      </div>
    </footer>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="InventoryLevel.js"></script>
</body>
</html>
