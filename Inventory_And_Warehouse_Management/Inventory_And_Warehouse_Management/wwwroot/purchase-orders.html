<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Purchase Orders — Inventory &amp; Warehouse Management</title>

    <!-- Bootstrap (grid + base components, per project rubric) -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Site styles (loaded after Bootstrap so overrides win) -->
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <!-- ============ HEADER ============ -->
    <header class="site-header">
      <div class="container header-inner">
        <a href="./index.html" class="brand">HOME</a>

        <button
          class="nav-toggle"
          id="navToggle"
          aria-label="Toggle navigation"
          aria-expanded="false"
          aria-controls="siteNav"
        >
          <span></span><span></span><span></span>
        </button>

        <nav class="site-nav" id="siteNav">
          <a href="./Register/login.html" id="loginNavBtn" class="btn btn-ghost"
            >Sign In</a
          >
          <a
            href="./Register/Register.html"
            id="registerNavBtn"
            class="btn btn-accent"
            >Create Account</a
          >

          <span id="userInfo" class="user-info hidden"></span>
          <button id="logoutBtn" class="btn btn-ghost hidden">Sign Out</button>
        </nav>
      </div>
    </header>

    <main>
      <!-- ============ PAGE HEADER ============ -->
      <section class="hero page-hero">
        <div class="container">
          <p class="hero-eyebrow">
            <a href="./index.html" class="crumb-link">&larr; Procurement</a>
          </p>
          <div class="page-hero-row">
            <h1 class="hero-title page-title">Purchase Orders</h1>
            <button
              class="btn btn-accent"
              id="openAddBtn"
              data-bs-toggle="modal"
              data-bs-target="#poModal"
            >
              + New Purchase Order
            </button>
          </div>
        </div>
      </section>

      <!-- ============ TABLE ============ -->
      <section class="modules">
        <div class="container">
          <div id="poAlert" class="alert-box hidden" role="alert"></div>

          <div class="table-wrap">
            <table class="table align-middle mb-0">
              <thead>
                <tr>
                  <th>Order Date</th>
                  <th>Status</th>
                  <th>Total Amount</th>
                  <th>Supplier ID</th>
                  <th>User ID</th>
                  <th class="text-end">Actions</th>
                </tr>
              </thead>
              <tbody id="poTableBody">
                <tr>
                  <td colspan="6" class="empty-row">
                    Loading purchase orders&hellip;
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </section>
    </main>

    <!-- ============ FOOTER ============ -->
    <footer class="site-footer">
      <div class="container footer-inner">
        <span>Inventory &amp; Warehouse Management System</span>
        <span>Spark to Code 2026</span>
      </div>
    </footer>

    <!-- ============ ADD / EDIT MODAL ============ -->
    <div
      class="modal fade"
      id="poModal"
      tabindex="-1"
      aria-labelledby="poModalLabel"
      aria-hidden="true"
    >
      <div class="modal-dialog">
        <div class="modal-content">
          <form id="poForm">
            <div class="modal-header">
              <h5 class="modal-title" id="poModalLabel">New Purchase Order</h5>
              <button
                type="button"
                class="btn-close"
                data-bs-dismiss="modal"
                aria-label="Close"
              ></button>
            </div>

            <div class="modal-body">
              <input type="hidden" id="poId" value="" />

              <div class="mb-3">
                <label for="poStatus" class="form-label">Status</label>
                <select class="form-select" id="poStatus" required>
                  <option value="Pending">Pending</option>
                  <option value="Approved">Approved</option>
                  <option value="Received">Received</option>
                </select>
              </div>

              <div class="mb-3">
                <label for="poOrderDate" class="form-label">Order Date</label>
                <input
                  type="date"
                  class="form-control"
                  id="poOrderDate"
                  required
                />
              </div>

              <div class="mb-3">
                <label for="poTotalAmount" class="form-label"
                  >Total Amount</label
                >
                <input
                  type="number"
                  step="0.01"
                  min="0"
                  class="form-control"
                  id="poTotalAmount"
                  required
                />
              </div>

              <div class="mb-3">
                <label for="poSupplierId" class="form-label">Supplier ID</label>
                <input
                  type="number"
                  min="1"
                  class="form-control"
                  id="poSupplierId"
                  required
                />
              </div>

              <div class="mb-3">
                <label for="poUserId" class="form-label">User ID</label>
                <input
                  type="number"
                  min="1"
                  class="form-control"
                  id="poUserId"
                  required
                />
              </div>
            </div>

            <div class="modal-footer">
              <button
                type="button"
                class="btn btn-ghost"
                data-bs-dismiss="modal"
              >
                Cancel
              </button>
              <button type="submit" class="btn btn-accent" id="poSaveBtn">
                Save Purchase Order
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <script src="./script.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="purchase-orders.js"></script>
  </body>
</html>
