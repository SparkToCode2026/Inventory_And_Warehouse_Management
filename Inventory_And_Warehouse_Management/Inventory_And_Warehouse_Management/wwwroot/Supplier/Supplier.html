<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Supplier Management</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="../style.css">
</head>
<body>

  <!-- Full access wall: SupplierController requires Manager/Admin for every endpoint -->
  <div id="accessDenied" class="hidden d-flex flex-column justify-content-center align-items-center text-center"
       style="min-height:100vh; padding:2rem;">
    <h2>Manager/Admin access required</h2>
    <p class="text-muted" style="color: var(--text-dim);">Supplier management is restricted to Manager and Admin users.</p>
    <div class="d-flex gap-2">
      <a href="../Register/Login.html" class="btn btn-accent">Sign In</a>
      <a href="../index.html" class="btn btn-outline">Back to Home</a>
    </div>
  </div>

  <div id="pageContent" class="hidden">

    <header class="site-header">
      <div class="header-inner container">
        <a href="../index.html" class="brand">HOME</a>

        <nav class="site-nav" id="siteNav">
          <a href="Supplier.html" class="nav-link">Suppliers</a>
          <span class="user-info" id="currentUserLabel"></span>
          <button class="btn btn-ghost hidden" id="logoutBtn" type="button">Log Out</button>
        </nav>
      </div>
    </header>

    <main class="container modules">
      <div class="zone">

        <div class="d-flex flex-wrap justify-content-between align-items-center zone-title">
          <h2>Supplier Management</h2>
          <button class="btn btn-accent" id="addSupplierBtn" type="button">+ Add Supplier</button>
        </div>

        <!-- Toolbar: filter by name / sort -->
        <div class="d-flex flex-wrap gap-2 mb-3">
          <input type="text" id="nameFilter" class="form-control" placeholder="Filter by name" style="max-width:200px;">
          <button id="applyFilterBtn" class="btn btn-outline" type="button">Filter</button>
          <button id="clearFilterBtn" class="btn btn-outline" type="button">Clear Filter</button>
          <button id="sortByOrdersBtn" class="btn btn-outline" type="button">Sort by # of Purchase Orders</button>
        </div>

        <div id="statusBanner" class="hidden mb-3"></div>

        <!-- Suppliers table -->
        <div class="card-module" style="padding:0; overflow-x:auto;">
          <table class="table mb-0 align-middle" id="suppliersTable">
            <thead>
              <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Email</th>
                <th>Phone</th>
                <th>Purchase Orders</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="suppliersTableBody">
              <!-- rows are built by Supplier.js -->
            </tbody>
          </table>
        </div>

      </div>
    </main>

    <footer class="site-footer">
      <div class="container footer-inner">
        <span>Inventory &amp; Warehouse Management System</span>
        <span>Spark to Code 2026</span>
      </div>
    </footer>

  </div>

  <!-- ADD / EDIT SUPPLIER -->
  <div class="modal fade" id="supplierModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="supplierModalTitle">Add Supplier</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <div class="mb-3">
            <label class="form-label" for="supplierName">Name</label>
            <input type="text" id="supplierName" class="form-control">
          </div>
          <div class="mb-3">
            <label class="form-label" for="supplierEmail">Email</label>
            <input type="email" id="supplierEmail" class="form-control">
          </div>
          <div class="mb-3">
            <label class="form-label" for="supplierPhone">Phone</label>
            <input type="text" id="supplierPhone" class="form-control">
          </div>
        </div>
        <div class="modal-footer">
          <button class="btn btn-outline" data-bs-dismiss="modal" type="button">Cancel</button>
          <button class="btn btn-accent" id="saveSupplierBtn" type="button">Save Supplier</button>
        </div>
      </div>
    </div>
  </div>

  <!-- UPDATE EMAIL (second distinct update case) -->
  <div class="modal fade" id="emailModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Update Email</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <div class="mb-3">
            <label class="form-label" for="newEmailInput">New Email</label>
            <input type="email" id="newEmailInput" class="form-control">
          </div>
        </div>
        <div class="modal-footer">
          <button class="btn btn-outline" data-bs-dismiss="modal" type="button">Cancel</button>
          <button class="btn btn-accent" id="saveEmailBtn" type="button">Update Email</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="Supplier.js"></script>
</body>
</html>
